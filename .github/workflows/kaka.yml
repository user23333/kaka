# This is a basic workflow to help you get started with Actions

name: kaka

# Controls when the workflow will run
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

# Serialize scheduled, Worker, and manual runs that update main.
concurrency:
  group: kaka-main
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
        with:
          # Check out the latest main after waiting for the concurrency lock.
          ref: main
      
      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: Start Cloudflare service
        run: |
          docker run -d --name cf-service -p 127.0.0.1:8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest --browsers 1
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/browsers >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs cf-service
          exit 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      
      - name: Run with retry
        uses: nick-fields/retry@v4.0.0
        env:
          V1: ${{ secrets.V1 }}
          V2: ${{ secrets.V2 }}
          V3: ${{ secrets.V3 }}
        with:
          timeout_minutes: 4
          max_attempts: 5
          retry_wait_seconds: 60
          command: python main.py


      - name: Push
        shell: bash
        run: |
          git config --global user.name "nobody"
          git config --global user.email "nobody@gmail.com"
          git add -A
          git commit -m "$(date '+%Y-%m-%d_%H%M%S')" || true
          git push
