# This is a basic workflow to help you get started with Actions

name: kaka

# Controls when the workflow will run
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

# Serialize scheduled, Worker, and manual runs that update main.
concurrency:
  group: kaka-main
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
        with:
          # Check out the latest main after waiting for the concurrency lock.
          ref: main
      
      - name: Set timezone
        run: tzutil /s "China Standard Time"

      - name: Select Microsoft Edge
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $edge)) { throw "Microsoft Edge not found: $edge" }
          "CHROME_BIN=$edge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      
      - name: Run with retry
        uses: nick-fields/retry@v4.0.0
        env:
          V1: ${{ secrets.V1 }}
          V2: ${{ secrets.V2 }}
          V3: ${{ secrets.V3 }}
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 60
          command: python main.py


      - name: Push
        shell: bash
        run: |
          git config --global user.name "nobody"
          git config --global user.email "nobody@gmail.com"
          git add -A
          git commit -m "$(date '+%Y-%m-%d_%H%M%S')" || true
          git push
